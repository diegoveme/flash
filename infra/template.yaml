        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthResetPasswordLogGroup.Arn
              - Sid: PasswordUpdate
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt Table.Arn
              - Sid: ReadValkeyCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ValkeyAuthSecret
              # AWS exception: these EC2 actions have no usable resource-level scope for Lambda VPC access (see infra/README.md).
