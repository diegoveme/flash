Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API (set it as VITE_API_URL when building the web app)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  ImagesDomain:
    Description: CloudFront domain that serves published images
    Value: !GetAtt ImagesDistribution.DomainName
  WebDomain:
    Description: CloudFront domain that serves the web app
    Value: !GetAtt WebDistribution.DomainName
  WebDistributionId:
    Description: Web distribution ID (for cache invalidations after a deploy)
    Value: !Ref WebDistribution
  WebBucketName:
    Description: Bucket for the web app build (apps/web/dist)
    Value: !Ref WebBucket
  BucketName:
    Description: Private bucket for uploads and published images
    Value: !Ref ImagesBucket
  TableName:
    Description: DynamoDB single table
    Value: !Ref Table
  ValkeyEndpoint:
    Description: ElastiCache Serverless endpoint (reachable only from the recovery Lambdas)
    Value: !GetAtt ValkeyCache.Endpoint.Address
