AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Flash (photography community MVP): HTTP API with one Lambda per route and one IAM role per
  Lambda, DynamoDB single table, ElastiCache Serverless (Valkey) for password recovery tokens,
  private S3 buckets served through CloudFront, and SES for email.

# Build the Lambda bundles first (repo root): bun infra/scripts/build-lambdas.mjs
# Then deploy from this folder: sam deploy --guided. See infra/README.md.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z][a-z0-9-]{1,15}$'
    Description: Environment name used in resource names (lowercase, 2 to 16 characters).
  WebAppUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https?://[^/\s]+$'
    Description: >-
      Origin of the web app (scheme + host, no trailing slash), used for CORS and email links.
      Leave empty to use the CloudFront distribution created by this template.
  SesFromAddress:
    Type: String
    Description: Sender address for password recovery emails (must belong to SesIdentityName).
  SesIdentityName:
    Type: String
    Description: Verified SES identity (domain or email address) that owns SesFromAddress.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that hosts ElastiCache and the password recovery Lambdas.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or three private subnets in different AZs, with a route to a NAT gateway (the
      recovery Lambdas call DynamoDB, Secrets Manager and SES through it).
  BcryptCost:
    Type: Number
    Default: 12
    MinValue: 10
    MaxValue: 14
    Description: bcrypt cost factor for password hashing.

Conditions:
  HasWebAppUrl: !Not [!Equals [!Ref WebAppUrl, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Handler: index.handler
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        DB_DRIVER: dynamodb
        STORAGE_DRIVER: s3
        MAIL_DRIVER: ses
        DYNAMODB_TABLE: !Ref Table
        S3_BUCKET: !Ref ImagesBucket
        IMAGES_BASE_URL: !Sub 'https://${ImagesDistribution.DomainName}'
        APP_BASE_URL: !If [HasWebAppUrl, !Ref WebAppUrl, !Sub 'https://${WebDistribution.DomainName}']
        CORS_ORIGIN: !If [HasWebAppUrl, !Ref WebAppUrl, !Sub 'https://${WebDistribution.DomainName}']
        BCRYPT_COST: !Ref BcryptCost

Resources:
  # ---------------------------------------------------------------------------
  # Data: DynamoDB single table (see docs/data-model.md)
  # ---------------------------------------------------------------------------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'flash-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
        - AttributeName: gsi2pk
          AttributeType: S
        - AttributeName: gsi2sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # Global feed. Sparse: only visible posts carry gsi1pk = FEED.
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Posts by author (public profile). Sparse: only visible posts.
        - IndexName: GSI2
          KeySchema:
            - AttributeName: gsi2pk
              KeyType: HASH
            - AttributeName: gsi2sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # ---------------------------------------------------------------------------
  # Storage: private images bucket (raw uploads + published images)
  # ---------------------------------------------------------------------------
  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # Browser uploads go straight to S3 with a presigned POST (multipart/form-data).
          - AllowedMethods:
              - POST
            AllowedOrigins:
              - !If [HasWebAppUrl, !Ref WebAppUrl, !Sub 'https://${WebDistribution.DomainName}']
            AllowedHeaders:
              - content-type
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAbandonedUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only published images, only through this CloudFront distribution.
          - Sid: AllowCloudFrontReadPublishedImages
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${ImagesBucket.Arn}/posts/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${ImagesDistribution}'
          # Deny statement: removes access over plain HTTP, grants nothing.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ImagesBucket.Arn
              - !Sub '${ImagesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # CDN: published images
  # ---------------------------------------------------------------------------
  ImagesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'flash-${Stage}-images'
        Description: Signed CloudFront access to the private images bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ImagesDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Flash ${Stage} published images'
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: images-bucket
            DomainName: !GetAtt ImagesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt ImagesOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: images-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # ---------------------------------------------------------------------------
  # CDN: web app (React SPA build from apps/web/dist)
  # ---------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadWebApp
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}'
          # Deny statement: removes access over plain HTTP, grants nothing.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt WebBucket.Arn
              - !Sub '${WebBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'flash-${Stage}-web'
        Description: Signed CloudFront access to the private web app bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Client-side routing: app routes (/, /posts/:id, /u/:username, /auth/reset, ...) serve
  # index.html. Built assets (/assets/*) and root files such as /favicon.svg pass through.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'flash-${Stage}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite SPA routes to /index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var isAsset = uri.indexOf('/assets/') === 0;
          var isRootFile = /^\/[^\/]+\.[a-zA-Z0-9]+$/.test(uri);
          if (isAsset === false && isRootFile === false) {
            request.uri = '/index.html';
          }
          return request;
        }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub 'Flash ${Stage} web app'
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web-bucket
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        # index.html and other root files: always revalidated so deploys show up at once.
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          # Managed-CachingDisabled
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Vite emits content-hashed files under /assets, safe to cache for long.
          - PathPattern: assets/*
            TargetOriginId: web-bucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            # Managed-CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            # Managed-SecurityHeadersPolicy
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  # ---------------------------------------------------------------------------
  # Network: only the password recovery Lambdas run inside the VPC
  # ---------------------------------------------------------------------------
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Flash password recovery Lambdas
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - Description: HTTPS to AWS APIs (DynamoDB, Secrets Manager, SES) through the NAT gateway
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  LambdaToValkeyEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      Description: Valkey (primary 6379, reader 6380)
      GroupId: !GetAtt LambdaSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6380
      DestinationSecurityGroupId: !GetAtt ValkeySecurityGroup.GroupId

  ValkeySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Flash ElastiCache Serverless (Valkey)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Valkey from the password recovery Lambdas only
          IpProtocol: tcp
          FromPort: 6379
          ToPort: 6380
          SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId
      SecurityGroupEgress:
        # Replaces the default allow-all egress rule: the cache needs no outbound traffic.
        - Description: No outbound traffic
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32

  # ---------------------------------------------------------------------------
  # Cache: ElastiCache Serverless (Valkey) for single-use password recovery tokens
  # ---------------------------------------------------------------------------
  ValkeyAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'flash/${Stage}/valkey-app-user'
      Description: Credentials of the Valkey RBAC user used by the password recovery Lambdas.
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"flash-${Stage}-app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Disabled "default" user: user groups must contain a user named default.
  ValkeyDefaultUser:
    Type: AWS::ElastiCache::User
    Properties:
      UserId: !Sub 'flash-${Stage}-default'
      UserName: default
      Engine: valkey
      AccessString: 'off -@all'
      AuthenticationMode:
        Type: no-password-required

  # Application user: only flash:* keys, no dangerous commands (FLUSHALL, KEYS, CONFIG, ...).
  ValkeyAppUser:
    Type: AWS::ElastiCache::User
    Properties:
      UserId: !Sub 'flash-${Stage}-app'
      UserName: !Sub 'flash-${Stage}-app'
      Engine: valkey
      AccessString: 'on ~flash:* -@all +@read +@write +@connection -@dangerous'
      AuthenticationMode:
        Type: password
        Passwords:
          - !Sub '{{resolve:secretsmanager:${ValkeyAuthSecret}:SecretString:password}}'

  ValkeyUserGroup:
    Type: AWS::ElastiCache::UserGroup
    Properties:
      UserGroupId: !Sub 'flash-${Stage}-users'
      Engine: valkey
      UserIds:
        - !Ref ValkeyDefaultUser
        - !Ref ValkeyAppUser

  # Serverless caches always encrypt in transit (TLS) and at rest.
  ValkeyCache:
    Type: AWS::ElastiCache::ServerlessCache
    Properties:
      ServerlessCacheName: !Sub 'flash-${Stage}'
      Description: Flash password recovery tokens (single use, 1 hour TTL)
      Engine: valkey
      MajorEngineVersion: '8'
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !GetAtt ValkeySecurityGroup.GroupId
      UserGroupId: !Ref ValkeyUserGroup
      CacheUsageLimits:
        DataStorage:
          Maximum: 1
          Unit: GB
        ECPUPerSecond:
          Maximum: 1000

  # ---------------------------------------------------------------------------
  # API: HTTP API (routes are declared by each function's HttpApi event)
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: !Sub 'Flash ${Stage} HTTP API'
      CorsConfiguration:
        AllowOrigins:
          - !If [HasWebAppUrl, !Ref WebAppUrl, !Sub 'https://${WebDistribution.DomainName}']
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  # ---------------------------------------------------------------------------
  # Functions: one per route, each with its own log group and IAM role.
  # Code comes from infra/dist/<function>/index.mjs (bun infra/scripts/build-lambdas.mjs).
  # ---------------------------------------------------------------------------

  # POST /auth/register  <-  apps/api/src/interfaces/http/handlers/auth/register.js
  AuthRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-register'
      Description: POST /auth/register
      CodeUri: dist/auth-register/
      Role: !GetAtt AuthRegisterRole.Arn
      MemorySize: 1024
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref AuthRegisterLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/register

  AuthRegisterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/flash-${Stage}-auth-register'
      RetentionInDays: 14

  AuthRegisterRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Flash ${Stage} least privilege role for POST /auth/register'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthRegisterLogGroup.Arn
              - Sid: UserAndSessionWrites
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt Table.Arn

  # POST /auth/login  <-  apps/api/src/interfaces/http/handlers/auth/login.js
  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-login'
      Description: POST /auth/login
      CodeUri: dist/auth-login/
      Role: !GetAtt AuthLoginRole.Arn
      MemorySize: 1024
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref AuthLoginLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/login

  AuthLoginLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/flash-${Stage}-auth-login'
      RetentionInDays: 14

  AuthLoginRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Flash ${Stage} least privilege role for POST /auth/login'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthLoginLogGroup.Arn
              - Sid: UserLookupAndSessionWrite
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt Table.Arn

  # POST /auth/logout  <-  apps/api/src/interfaces/http/handlers/auth/logout.js
  AuthLogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-logout'
      Description: POST /auth/logout
      CodeUri: dist/auth-logout/
      Role: !GetAtt AuthLogoutRole.Arn
      LoggingConfig:
        LogGroup: !Ref AuthLogoutLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/logout

  AuthLogoutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/flash-${Stage}-auth-logout'
      RetentionInDays: 14

  AuthLogoutRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Flash ${Stage} least privilege role for POST /auth/logout'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthLogoutLogGroup.Arn
              - Sid: SessionRevoke
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt Table.Arn

  # GET /auth/me  <-  apps/api/src/interfaces/http/handlers/auth/me.js
  AuthMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-me'
      Description: GET /auth/me
      CodeUri: dist/auth-me/
      Role: !GetAtt AuthMeRole.Arn
      LoggingConfig:
        LogGroup: !Ref AuthMeLogGroup
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /auth/me

  AuthMeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/flash-${Stage}-auth-me'
      RetentionInDays: 14

  AuthMeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Flash ${Stage} least privilege role for GET /auth/me'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthMeLogGroup.Arn
              - Sid: SessionRead
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt Table.Arn

  # POST /auth/password-recovery  <-  apps/api/src/interfaces/http/handlers/auth/requestPasswordRecovery.js
  AuthRequestPasswordRecoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-request-password-recovery'
      Description: POST /auth/password-recovery
      CodeUri: dist/auth-request-password-recovery/
      Role: !GetAtt AuthRequestPasswordRecoveryRole.Arn
      LoggingConfig:
        LogGroup: !Ref AuthRequestPasswordRecoveryLogGroup
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          CACHE_DRIVER: redis
          REDIS_HOST: !GetAtt ValkeyCache.Endpoint.Address
          REDIS_PORT: !GetAtt ValkeyCache.Endpoint.Port
          REDIS_TLS: 'true'
          REDIS_SECRET_ARN: !Ref ValkeyAuthSecret
          SES_FROM_ADDRESS: !Ref SesFromAddress
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /auth/password-recovery

  AuthRequestPasswordRecoveryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/flash-${Stage}-auth-request-password-recovery'
      RetentionInDays: 14

  AuthRequestPasswordRecoveryRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Flash ${Stage} least privilege role for POST /auth/password-recovery'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: least-privilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AuthRequestPasswordRecoveryLogGroup.Arn
              - Sid: UserLookup
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt Table.Arn
              - Sid: ReadValkeyCredentials
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref ValkeyAuthSecret
              - Sid: SendRecoveryEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: !Sub 'arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityName}'
              # AWS exception: these EC2 actions have no usable resource-level scope for Lambda VPC access (see infra/README.md).
              - Sid: ManageVpcNetworkInterfaces
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'

  # POST /auth/password-reset  <-  apps/api/src/interfaces/http/handlers/auth/resetPassword.js
  AuthResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'flash-${Stage}-auth-reset-password'
      Description: POST /auth/password-reset
      CodeUri: dist/auth-reset-password/
      Role: !GetAtt AuthResetPasswordRole.Arn
      MemorySize: 1024
      Timeout: 15
      LoggingConfig:
        LogGroup: !Ref AuthResetPasswordLogGroup
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          CACHE_DRIVER: redis
          REDIS_HOST: !GetAtt ValkeyCache.Endpoint.Address
          REDIS_PORT: !GetAtt ValkeyCache.Endpoint.Port
          REDIS_TLS: 'true'
